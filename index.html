<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play-Along — practice studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">🎵</span> Play-Along</div>

        <div class="song-meta">
          <span id="song-title" class="song-title">No song loaded</span>
          <span id="song-artist" class="song-artist"></span>
        </div>

        <div class="topbar-actions">
          <label class="select-wrap" title="Saved songs">
            <select id="song-select" class="song-select">
              <option value="">Saved songs…</option>
            </select>
          </label>
          <button id="import-btn" class="btn btn-primary">Import file…</button>
          <button id="settings-btn" class="btn icon" title="Settings" aria-label="Settings">⚙</button>
          <input
            id="file-input"
            type="file"
            accept=".gp,.gp3,.gp4,.gp5,.gpx,.gp7,.gp8,.xml,.musicxml,.cap,.capx"
            hidden
          />
        </div>
      </header>

      <div class="body">
        <aside class="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-title">
              <span>Tracks &amp; Mixer</span>
            </div>
            <div class="sidebar-hint">
              Click a name to show/hide it in the score. Use the controls to
              balance the mix or solo the drums. Solo a track or use the Practice panel's selector to focus it.
            </div>
            <div id="track-list" class="track-list"></div>
          </div>
        </aside>

        <main class="content">
          <div id="at-viewport" class="at-viewport">
            <div id="at-main" class="at-main"></div>
          </div>

          <div id="loading-overlay" class="overlay is-visible">
            <div class="overlay-box">
              <div class="spinner"></div>
              <span id="loading-text">Starting up…</span>
            </div>
          </div>

          <div id="drop-overlay" class="overlay drop-overlay">
            <div class="overlay-box drop-box">
              <div class="drop-icon">⬇</div>
              <div>Drop a Guitar Pro / MusicXML file (drums, sax, guitar…) to load it</div>
            </div>
          </div>
        </main>
      </div>

      <footer id="transport" class="transport"></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
